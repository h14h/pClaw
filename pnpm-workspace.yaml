packages:
  - web

# Pi 1.0 shipped 2026-10-01; let it through pnpm's default 24h release-age gate.
minimumReleaseAgeExclude:
  - "@earendil-works/*"

# The last two belong to pi-ai's optional Google provider, which pclaw doesn't use.
allowBuilds:
  esbuild: true
  lightningcss: true
  "@google/genai": false
  protobufjs: false
